          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-plan-3
          path: ${{ runner.temp }}/stable-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-docs-audit-3
          path: ${{ runner.temp }}/docs-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-changelog-ai-3
          path: ${{ runner.temp }}/changelog-ai
      - id: create
        env:
          RELEASE_APP_INSTALLATION_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set +e
          # Task 9 sequence: runPreparedCreation ->
          # acquireCreationOwnership -> finalizeCreation;
          # every pre-visible-PR failure uses abortOwnedCreation.
          bun scripts/release/prepare-main.ts --phase open-pr --attempt 3 --input "$RUNNER_TEMP/stable-plan/stable-plan.json" --docs-audit "$RUNNER_TEMP/docs-audit/docs-audit.json" --changelog "$RUNNER_TEMP/changelog-ai/changelog-ai.json"
          status=$?
          echo "outcome=${PREPARE_OUTCOME:-unknown}" >> "$GITHUB_OUTPUT"
          if [ "$status" -ne 0 ]; then
            {
              echo '## Stable release preparation failed'
              echo "Typed result: ${PREPARE_OUTCOME:-unknown}"
              echo "Recovery: https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release-stable-prepare.yml"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

  recovery-summary:
    name: Record stable preparation recovery link
    if: always()
    needs:
      - authorize
      - plan
      - docs-release-audit
      - changelog-ai
      - open-pr
      - plan-2
      - docs-release-audit-2
      - changelog-ai-2
      - open-pr-2
      - plan-3
      - docs-release-audit-3
      - changelog-ai-3
      - open-pr-3
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Write bounded recovery guidance
        env:
          RECOVERY_URL: https://github.com/${{ github.repository }}/actions/workflows/release-stable-prepare.yml
        run: |
          {
            echo '## Stable release preparation'
            echo 'Inspect the failed job summary for its typed terminal result.'
            echo "Recovery and re-dispatch: ${RECOVERY_URL}"
            echo 'CreationCleanupPending requires the read-only release doctor before resume.'
          } >> "$GITHUB_STEP_SUMMARY"
