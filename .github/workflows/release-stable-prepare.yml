      - run: bun scripts/release/prepare-main.ts --phase docs-release-audit --attempt 2 --input "$RUNNER_TEMP/stable-plan/stable-plan.json" --output "$RUNNER_TEMP/docs-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-prepare-docs-audit-2
          path: ${{ runner.temp }}/docs-audit.json
          if-no-files-found: error
          retention-days: 1

  changelog-ai-2:
    name: Generate changelog prose 2
    needs: [plan-2, docs-release-audit-2]
    if: needs.docs-release-audit-2.result == 'success'
    runs-on: ubuntu-latest
    environment: release-ai
    permissions:
      contents: read
    env:
      WEAVE_RELEASE_AI_API_KEY: ${{ secrets.WEAVE_RELEASE_AI_API_KEY }}
      INPUT_CLI: ${{ inputs.cli }}
      INPUT_OPENCODE: ${{ inputs.opencode }}
      INPUT_CLAUDE_CODE: ${{ inputs.claude-code }}
      INPUT_PI: ${{ inputs.pi }}
      INPUT_THINKING: ${{ inputs.thinking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
