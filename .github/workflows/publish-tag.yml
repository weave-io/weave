name: Publish Package

on:
  push:
    tags:
      - 'cli@*'
      - 'opencode@*'
      - 'claude-code@*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if ! echo "$TAG" | grep -qE '^(cli|opencode|claude-code)@[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag must match pattern: ^(cli|opencode|claude-code)@[0-9]+\.[0-9]+\.[0-9]+$"
            echo "::error::Got: $TAG"
            exit 1
          fi
          echo "✓ Tag format valid: $TAG"

      - name: Validate tag commit equals origin/main
        run: |
          git fetch origin refs/heads/main:refs/remotes/origin/main
          TAG_COMMIT=$(git rev-parse HEAD)
          MAIN_COMMIT=$(git rev-parse origin/main)

          if [ "$TAG_COMMIT" != "$MAIN_COMMIT" ]; then
            echo "::error::Tag commit does not match origin/main"
            echo "::error::Tag commit:  $TAG_COMMIT"
            echo "::error::Main commit: $MAIN_COMMIT"
            exit 1
          fi

          echo "✓ Tag commit matches origin/main: $TAG_COMMIT"

      - name: Parse tag and resolve package
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Full tag: $TAG"

          # Split on @
          SHORT_NAME="${TAG%@*}"
          VERSION="${TAG#*@}"

          echo "short_name=$SHORT_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Map short name to directory and npm package name
          case "$SHORT_NAME" in
            cli)
              echo "package_dir=packages/cli" >> $GITHUB_OUTPUT
              echo "package_name=@weaveio/weave-cli" >> $GITHUB_OUTPUT
              ;;
            opencode)
              echo "package_dir=packages/adapters/opencode" >> $GITHUB_OUTPUT
              echo "package_name=@weaveio/weave-adapter-opencode" >> $GITHUB_OUTPUT
              ;;
            claude-code)
              echo "package_dir=packages/adapters/claude-code" >> $GITHUB_OUTPUT
              echo "package_name=@weaveio/weave-adapter-claude-code" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "::error::Unknown package short name: $SHORT_NAME"
              exit 1
              ;;
          esac

      - name: Validate package.json version
        env:
          PACKAGE_DIR: ${{ steps.parse.outputs.package_dir }}
          TAG_VERSION: ${{ steps.parse.outputs.version }}
        run: |
          if [ ! -f "$PACKAGE_DIR/package.json" ]; then
            echo "::error::package.json not found at $PACKAGE_DIR/package.json"
            exit 1
          fi

          PKG_VERSION=$(bun -e "console.log(JSON.parse(await Bun.file(process.env.PACKAGE_DIR + '/package.json').text()).version)")

          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch: package.json has $PKG_VERSION but tag specifies $TAG_VERSION"
            exit 1
          fi

          echo "✓ Version validated: $TAG_VERSION"

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        working-directory: ${{ steps.parse.outputs.package_dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.WEAVEIO_NPM_TOKEN }}
        run: |
          set +e
          OUTPUT=$(npm publish --ignore-scripts --access public --provenance 2>&1)
          EXIT_CODE=$?
          set -e

          echo "$OUTPUT"

          # Check for idempotent failure (version already published)
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "cannot publish over previously published version"; then
              echo "::notice::Package version already published - skipping (idempotent)"
              exit 0
            elif echo "$OUTPUT" | grep -q "You cannot publish over the previously published versions"; then
              echo "::notice::Package version already published - skipping (idempotent)"
              exit 0
            else
              echo "::error::npm publish failed with exit code $EXIT_CODE"
              exit $EXIT_CODE
            fi
          fi

          echo "✓ Published successfully"

      - name: Summary
        env:
          PACKAGE_NAME: ${{ steps.parse.outputs.package_name }}
          VERSION: ${{ steps.parse.outputs.version }}
          TAG: ${{ github.ref_name }}
          PACKAGE_DIR: ${{ steps.parse.outputs.package_dir }}
        run: |
          {
            echo "## Package Published"
            echo ""
            echo "- **Package**: \`${PACKAGE_NAME}\`"
            echo "- **Version**: \`${VERSION}\`"
            echo "- **Tag**: \`${TAG}\`"
            echo "- **Directory**: \`${PACKAGE_DIR}\`"
            echo ""
            echo "View on npm: https://www.npmjs.com/package/${PACKAGE_NAME}/v/${VERSION}"
          } >> "$GITHUB_STEP_SUMMARY"
