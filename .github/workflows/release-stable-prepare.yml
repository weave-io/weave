name: Prepare stable release PR

on:
  workflow_dispatch:
    inputs:
      cli:
        description: "Prepare @weaveio/weave-cli"
        required: true
        type: boolean
        default: false
      opencode:
        description: "Prepare @weaveio/weave-adapter-opencode"
        required: true
        type: boolean
        default: false
      claude-code:
        description: "Prepare @weaveio/weave-adapter-claude-code"
        required: true
        type: boolean
        default: false
      pi:
        description: "Prepare @weaveio/weave-adapter-pi"
        required: true
        type: boolean
        default: false
      thinking:
        description: "Thinking level for the release agents"
        required: true
        type: choice
        default: medium
        options:
          - off
          - minimal
          - low
          - medium
          - high
          - xhigh
          - max

# The default-deny policy is intentional. Each job below grants only the read
# or write permission it needs. There is deliberately no workflow-wide
# replacement setting: replacing a pending dispatch would silently lose an explicit request.
permissions: {}

jobs:
  authorize:
    name: Authorize stable preparation request
    runs-on: ubuntu-latest
    environment: release-app
    permissions:
      contents: read
    outputs:
      selected: ${{ steps.request.outputs.selected }}
      thinking: ${{ steps.request.outputs.thinking }}
    env:
      INPUT_CLI: ${{ inputs.cli }}
      INPUT_OPENCODE: ${{ inputs.opencode }}
      INPUT_CLAUDE_CODE: ${{ inputs.claude-code }}
      INPUT_PI: ${{ inputs.pi }}
      INPUT_THINKING: ${{ inputs.thinking }}
      PREPARE_ACTOR: ${{ github.actor }}
    steps:
      - id: release-app-token
        name: Mint short-lived release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-members: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - id: request
        name: Validate request and maintainer authorization
        env:
          RELEASE_APP_INSTALLATION_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          # Task 9 authorization is the first controller operation.
          # It calls assertStableRequestAuthorized before any plan or AI work.
          bun scripts/release/prepare-main.ts --phase authorize --attempt 1
          {
            echo "selected={\"cli\":${INPUT_CLI},\"opencode\":${INPUT_OPENCODE},\"claude-code\":${INPUT_CLAUDE_CODE},\"pi\":${INPUT_PI}}"
            echo "thinking=${INPUT_THINKING}"
          } >> "$GITHUB_OUTPUT"

  plan:
    name: Compute closure, versions, and evidence
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      INPUT_CLI: ${{ inputs.cli }}
      INPUT_OPENCODE: ${{ inputs.opencode }}
      INPUT_CLAUDE_CODE: ${{ inputs.claude-code }}
      INPUT_PI: ${{ inputs.pi }}
      INPUT_THINKING: ${{ needs.authorize.outputs.thinking }}
      PREPARE_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Verify green main and compute the bounded plan
        run: bun scripts/release/prepare-main.ts --phase plan --attempt 1 --output "$RUNNER_TEMP/stable-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-prepare-plan-1
          path: ${{ runner.temp }}/stable-plan.json
          if-no-files-found: error
          retention-days: 1

  docs-release-audit:
    name: Run deterministic and AI release docs gate
    needs: plan
    runs-on: ubuntu-latest
    environment: release-ai
    permissions:
      contents: read
    env:
      WEAVE_RELEASE_AI_API_KEY: ${{ secrets.WEAVE_RELEASE_AI_API_KEY }}
      INPUT_CLI: ${{ inputs.cli }}
      INPUT_OPENCODE: ${{ inputs.opencode }}
      INPUT_CLAUDE_CODE: ${{ inputs.claude-code }}
      INPUT_PI: ${{ inputs.pi }}
      INPUT_THINKING: ${{ inputs.thinking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-plan-1
          path: ${{ runner.temp }}/stable-plan
      - name: Re-run the complete SHA-bound release docs gate
        run: bun scripts/release/prepare-main.ts --phase docs-release-audit --attempt 1 --input "$RUNNER_TEMP/stable-plan/stable-plan.json" --output "$RUNNER_TEMP/docs-audit.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-prepare-docs-audit-1
          path: ${{ runner.temp }}/docs-audit.json
          if-no-files-found: error
          retention-days: 1

  changelog-ai:
    name: Generate changelog prose
    needs: [plan, docs-release-audit]
    runs-on: ubuntu-latest
    environment: release-ai
    permissions:
      contents: read
    env:
      WEAVE_RELEASE_AI_API_KEY: ${{ secrets.WEAVE_RELEASE_AI_API_KEY }}
      INPUT_CLI: ${{ inputs.cli }}
      INPUT_OPENCODE: ${{ inputs.opencode }}
      INPUT_CLAUDE_CODE: ${{ inputs.claude-code }}
      INPUT_PI: ${{ inputs.pi }}
      INPUT_THINKING: ${{ inputs.thinking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-plan-1
          path: ${{ runner.temp }}/stable-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-docs-audit-1
          path: ${{ runner.temp }}/docs-audit
      - name: Run the isolated changelog agent
        run: bun scripts/release/prepare-main.ts --phase changelog-ai --attempt 1 --input "$RUNNER_TEMP/stable-plan/stable-plan.json" --docs-audit "$RUNNER_TEMP/docs-audit/docs-audit.json" --output "$RUNNER_TEMP/changelog-ai.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-prepare-changelog-ai-1
          path: ${{ runner.temp }}/changelog-ai.json
          if-no-files-found: error
          retention-days: 1

  open-pr:
    name: Claim marker and open stable release PR
    needs: [authorize, plan, docs-release-audit, changelog-ai]
    runs-on: ubuntu-latest
    environment: release-app
    permissions:
      contents: write
      pull-requests: write
      checks: read
    env:
      INPUT_CLI: ${{ inputs.cli }}
      INPUT_OPENCODE: ${{ inputs.opencode }}
      INPUT_CLAUDE_CODE: ${{ inputs.claude-code }}
      INPUT_PI: ${{ inputs.pi }}
      INPUT_THINKING: ${{ inputs.thinking }}
    outputs:
      outcome: ${{ steps.create.outputs.outcome }}
    steps:
      - id: release-app-token
        name: Mint short-lived release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-plan-1
          path: ${{ runner.temp }}/stable-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-docs-audit-1
          path: ${{ runner.temp }}/docs-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-prepare-changelog-ai-1
          path: ${{ runner.temp }}/changelog-ai
      - id: create
        name: Create only through Task 9 ownership and finalize
        env:
          RELEASE_APP_INSTALLATION_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set +e
          # Task 9 sequence: runPreparedCreation ->
          # acquireCreationOwnership -> finalizeCreation;
          # every pre-visible-PR failure uses abortOwnedCreation.
          bun scripts/release/prepare-main.ts --phase open-pr --attempt 1 --input "$RUNNER_TEMP/stable-plan/stable-plan.json" --docs-audit "$RUNNER_TEMP/docs-audit/docs-audit.json" --changelog "$RUNNER_TEMP/changelog-ai/changelog-ai.json"
          status=$?
          echo "outcome=${PREPARE_OUTCOME:-unknown}" >> "$GITHUB_OUTPUT"
          exit "$status"

  plan-2:
    name: Replan 2 after PreparationStale
    needs: open-pr
    if: always() && needs.open-pr.outputs.outcome == 'PreparationStale'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      INPUT_CLI: ${{ inputs.cli }}
