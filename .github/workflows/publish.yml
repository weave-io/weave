name: Publish control plane

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Validated release operation (this skeleton only builds artifacts)
        required: true
        type: choice
        options: [nightly, stable-cut, stable-fix, stable-publish, stable-finalize, metadata-replay]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      payload-artifact-id: ${{ steps.payload.outputs.artifact-id }}
      payload-artifact-digest: ${{ steps.payload.outputs.artifact-digest }}
      control-artifact-id: ${{ steps.control.outputs.artifact-id }}
      control-artifact-digest: ${{ steps.control.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run release:validate
      - run: bun run release:control:build
      - id: payload
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: release-payload
          path: .release
          if-no-files-found: error
      - id: control
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: release-control
          path: dist-release-control
          if-no-files-found: error

  bind:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      binding-artifact-id: ${{ steps.binding.outputs.artifact-id }}
      binding-artifact-digest: ${{ steps.binding.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      # Task 13 supplies the validated invocation and manifest used by this script.
      - run: bun scripts/release/artifact-binding.ts
      - id: binding
        uses: actions/upload-artifact@0b7f8abb1508181956e8e162db84b466c27e18ce # v4
        with:
          name: release-binding
          path: .release/binding.json
          if-no-files-found: error
