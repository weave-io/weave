name: OpenCode 2 live check

# Does Weave actually work on a real OpenCode 2 host? Each leg installs a real
# `@opencode/cli`, installs Weave into a fresh project, and checks from outside
# the host that the builtin agents and /weave:start are registered, then sends
# one message to Loom and checks that Loom's prompt reached a scripted local
# model and that Loom delegated to Shuttle and got the result back. No
# credentials or remote models. See docs/testing/opencode2-verification.md.
#
# - `pinned` runs on every change that can affect the adapter: this revision's
#   adapter, packed as it would be published, on the host version it pins.
# - `canary` runs daily and on demand against `@opencode/cli@latest`, for this
#   revision's adapter and for what a user installs today (the `next`
#   package, and the documented `weave init`). The host moves without any
#   change here, which is why a path-filtered workflow cannot catch it (#236).

on:
  push:
    branches: [main]
    paths:
      - 'packages/adapters/opencode2/**'
      - 'packages/core/**'
      - 'packages/config/**'
      - 'packages/engine/**'
      - 'scripts/build-public-packages.ts'
      - 'scripts/proof/opencode2-live/**'
      - '.github/workflows/opencode2-live.yml'
  pull_request:
    branches: [main]
    paths:
      - 'packages/adapters/opencode2/**'
      - 'packages/core/**'
      - 'packages/config/**'
      - 'packages/engine/**'
      - 'scripts/build-public-packages.ts'
      - 'scripts/proof/opencode2-live/**'
      - '.github/workflows/opencode2-live.yml'
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pinned:
    name: Pinned host — this revision
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Live check
        run: >-
          bun scripts/proof/opencode2-live/main.ts
          --host pinned
          --plugin local
          --root "$RUNNER_TEMP/opencode2-live"

  canary:
    name: Latest host — ${{ matrix.name }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: this revision
            plugin: local
          - name: published next package
            plugin: npm:@weaveio/weave-adapter-opencode2@next
          - name: documented weave init
            plugin: init:@weaveio/weave-cli@next

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Live check
        env:
          PLUGIN: ${{ matrix.plugin }}
        run: >-
          bun scripts/proof/opencode2-live/main.ts
          --host latest
          --plugin "$PLUGIN"
          --root "$RUNNER_TEMP/opencode2-live"
