name: Regenerate stable release PR

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Do not add a workflow-level or job-level release-PR concurrency key here.
# Git ref leases serialize writers without replacing pending push events.
permissions: {}

jobs:
  manual-authorize:
    name: Authorize maintainer retry
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: release-app
    permissions:
      contents: read
    env:
      REGENERATION_ACTOR: ${{ github.actor }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
    steps:
      - id: release-app-token
        name: Mint short-lived release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-members: read
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Verify the retry actor
        env:
          RELEASE_APP_INSTALLATION_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          # The production adapter injects Task 9's
          # assertStableRequestAuthorized(actor) with the ephemeral App token here.
          # This phase has no create operation and cannot make a release PR.
          bun scripts/release/regenerate-main.ts --phase detect --attempt 1 --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"

  detect:
    name: Detect an eligible stable release PR
    needs: manual-authorize
    if: always() && (github.event_name == 'push' || needs.manual-authorize.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      should_run: ${{ steps.detect.outputs.should_run }}
      reason: ${{ steps.detect.outputs.reason }}
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      REGENERATION_ATTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && 'maintainer-retry' || 'automatic-main-advance' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - id: pending
        name: Classify pending Changeset changes
        shell: bash
        run: |
          pending=false
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git diff-tree --no-commit-id --name-only -r -m --diff-filter=AMR "$GITHUB_SHA" -- .changeset | grep -q .; then
            pending=true
          fi
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
      - id: detect
        name: Run the non-creating discovery phase
        env:
          PENDING_CHANGES_CHANGED: ${{ steps.pending.outputs.pending }}
          SELF_RELEASE_MERGE: ${{ contains(github.event.head_commit.message, 'chore(release): version packages') }}
          CHANGESET_CLEANUP_MERGE: ${{ contains(github.event.head_commit.message, 'chore(release): remove consumed changesets') }}
        run: |
          set -euo pipefail
          # Task 9 discovery returns a neutral green no-op for absent marker +
          # absent PR. A marker without a visible PR is creation-in-progress;
          # update-pr later performs its bounded poll and never creates.
          bun scripts/release/regenerate-main.ts --phase detect --attempt 1 --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "reason=discovery-deferred-to-controller" >> "$GITHUB_OUTPUT"
          {
            echo '## Stable release-PR regeneration'
            echo "Attribution: $REGENERATION_ATTRIBUTION."
            echo 'No shared release-PR concurrency key is used; Task 9 CAS leases converge writers.'
            echo 'An absent marker and absent PR is a neutral green no-op. This workflow never creates a PR.'
          } >> "$GITHUB_STEP_SUMMARY"

  plan:
    name: Rebuild the SHA-bound regeneration plan
    needs: detect
    if: needs.detect.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - name: Compute the latest green-main plan
        run: bun scripts/release/regenerate-main.ts --phase plan --attempt 1 --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --output "$RUNNER_TEMP/regeneration-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-regeneration-plan
          path: ${{ runner.temp }}/regeneration-plan.json
          if-no-files-found: error
          retention-days: 1

  docs-release-audit:
    name: Re-audit release docs at the latest SHA
    needs: plan
    runs-on: ubuntu-latest
    environment: release-ai
    permissions:
      contents: read
      checks: write
    env:
      WEAVE_RELEASE_AI_API_KEY: ${{ secrets.WEAVE_RELEASE_AI_API_KEY }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-regeneration-plan
          path: ${{ runner.temp }}/regeneration-plan
      - name: Run deterministic checker, conditional docs agent, and shared gate
        run: bun scripts/release/regenerate-main.ts --phase docs-release-audit --attempt 1 --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --input "$RUNNER_TEMP/regeneration-plan/regeneration-plan.json" --output "$RUNNER_TEMP/docs-audit.json" --report-check true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-regeneration-docs-audit
          path: ${{ runner.temp }}/docs-audit.json
          if-no-files-found: error
          retention-days: 1

  changelog-ai:
    name: Generate only new or changed changelog entries
    needs: [plan, docs-release-audit]
    runs-on: ubuntu-latest
    environment: release-ai
    permissions:
      contents: read
    env:
      WEAVE_RELEASE_AI_API_KEY: ${{ secrets.WEAVE_RELEASE_AI_API_KEY }}
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-regeneration-plan
          path: ${{ runner.temp }}/regeneration-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-regeneration-docs-audit
          path: ${{ runner.temp }}/docs-audit
      - name: Run the isolated changelog agent
        run: bun scripts/release/regenerate-main.ts --phase changelog-ai --attempt 1 --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --input "$RUNNER_TEMP/regeneration-plan/regeneration-plan.json" --docs-audit "$RUNNER_TEMP/docs-audit/docs-audit.json" --output "$RUNNER_TEMP/changelog-ai.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stable-regeneration-changelog-ai
          path: ${{ runner.temp }}/changelog-ai.json
          if-no-files-found: error
          retention-days: 1

  update-pr:
    name: CAS-update the existing stable release PR
    needs: [detect, plan, docs-release-audit, changelog-ai]
    if: needs.detect.outputs.should_run == 'true' && needs.docs-release-audit.result == 'success' && needs.changelog-ai.result == 'success'
    runs-on: ubuntu-latest
    environment: release-app
    permissions:
      contents: write
      pull-requests: write
      checks: write
    env:
      GITHUB_EVENT_NAME: ${{ github.event_name }}
      GITHUB_REF: ${{ github.ref }}
      GITHUB_ACTOR: ${{ github.actor }}
      REGENERATION_ATTRIBUTION: ${{ github.event_name == 'workflow_dispatch' && 'maintainer-retry' || 'automatic-main-advance' }}
    steps:
      - id: release-app-token
        name: Mint short-lived release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-regeneration-plan
          path: ${{ runner.temp }}/regeneration-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-regeneration-docs-audit
          path: ${{ runner.temp }}/docs-audit
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: stable-regeneration-changelog-ai
          path: ${{ runner.temp }}/changelog-ai
      - name: Update only through Task 9 regeneration
        env:
          RELEASE_APP_INSTALLATION_TOKEN: ${{ steps.release-app-token.outputs.token }}
        run: |
          set -euo pipefail
          # This is the sole workflow job that invokes Task 9's regenerate
          # operation. It never calls create or opens a pull request.
          bun scripts/release/regenerate-main.ts --phase update-pr --attempt 1 --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" --input "$RUNNER_TEMP/regeneration-plan/regeneration-plan.json" --docs-audit "$RUNNER_TEMP/docs-audit/docs-audit.json" --changelog "$RUNNER_TEMP/changelog-ai/changelog-ai.json"
          {
            echo '## Stable release-PR regeneration applied'
            echo "Attribution: $REGENERATION_ATTRIBUTION."
            echo 'Task 9 force-with-lease CAS, pre-CAS main recheck, monotonic freshness, and bounded retries were used.'
            echo 'Ruleset stale-approval dismissal and the release-policy freshness check invalidate stale approvals.'
          } >> "$GITHUB_STEP_SUMMARY"

  recovery-summary:
    name: Record regeneration recovery guidance
    if: always()
    needs:
      - manual-authorize
      - detect
      - plan
      - docs-release-audit
      - changelog-ai
      - update-pr
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Write bounded recovery guidance
        run: |
          {
            echo '## Stable release-PR regeneration'
            echo 'A push is automatic convergence; workflow_dispatch is a guarded retry only.'
            echo 'No release PR is created by this workflow.'
            echo 'Docs-audit failures leave the existing PR and marker byte-identical and publish a typed blocking check.'
            echo 'Resolve EditConflict in the PR prose or on main, then wait for the next push or use the guarded retry.'
            echo 'A failed lease, stale head, or superseded run converges on a later main push.'
          } >> "$GITHUB_STEP_SUMMARY"
