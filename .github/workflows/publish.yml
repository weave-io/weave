name: Publish control plane
# The run-name is stable evidence for the pre-cutover doctor. Only the
# protected-main `legacy-publisher-preflight` identity can prove a dispatch.
run-name: legacy-publisher-${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'scheduled' }}

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Release control operation
        required: true
        type: choice
        options: [nightly, stable-cut, stable-fix, stable-publish, stable-finalize, metadata-replay, preflight]
      promotion-authorization:
        description: Exact JSON authorization record emitted by stable-publish (stable-finalize only)
        required: false
        type: string
      stable-train:
        description: "Exact JSON train: fresh for stable-publish; awaiting-promotion for stable-finalize"
        required: false
        type: string
      stable-plan-input:
        description: Exact JSON input for stable cut/fix planning
        required: false
        type: string
      metadata-replay-input:
        description: Exact JSON input for metadata replay planning
        required: false
        type: string

permissions: {}

# Publication runs must serialize; completed runs are never cancelled mid-proof.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # This path deliberately avoids dependency installation. It is the only job
  # that can produce the stable read-only preflight run identity.
  legacy-preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'preflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - name: Validate legacy publication enablement (read-only)
        run: bun scripts/release/legacy-preflight.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_WORKFLOW_PATH: .github/workflows/publish.yml
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}

  preflight:
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'preflight'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      operation: ${{ steps.plan.outputs.operation }}
      skipped: ${{ steps.plan.outputs.skipped }}
      versions: ${{ steps.plan.outputs.versions }}
      stable-plan-input: ${{ steps.plan.outputs.stable_plan_input }}
      metadata-replay-input: ${{ steps.plan.outputs.metadata_replay_input }}
      stable-train: ${{ steps.plan.outputs.stable_train }}
    steps:
      # Always execute control code from the protected branch, not the dispatch ref.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      # This trusted control script validates enablement, source identity, and the
      # named main check before emitting the only allowed plan operation.
      - id: plan
        run: bun scripts/release/nightly-plan.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_ENABLED: ${{ vars.RELEASE_PUBLISH_ENABLED }}
          RELEASE_EVENT_NAME: ${{ github.event_name }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_WORKFLOW_REF: ${{ github.workflow_ref }}
          RELEASE_STABLE_TRAIN: ${{ inputs.stable-train }}
          RELEASE_STABLE_PLAN_INPUT: ${{ inputs.stable-plan-input }}
          RELEASE_METADATA_REPLAY_INPUT: ${{ inputs.metadata-replay-input }}

  build:
    needs: preflight
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && (needs.preflight.outputs.operation == 'nightly' || needs.preflight.outputs.operation == 'stable-publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      payload-artifact-id: ${{ steps.payload.outputs.artifact-id }}
      payload-artifact-digest: ${{ steps.payload.outputs.artifact-digest }}
      control-artifact-id: ${{ steps.control.outputs.artifact-id }}
      control-artifact-digest: ${{ steps.control.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run release:validate
        env:
          RELEASE_PLANNED_VERSIONS: ${{ needs.preflight.outputs.versions }}
          RELEASE_OPERATION: ${{ needs.preflight.outputs.operation }}
      - run: bun scripts/release/write-artifact-manifest.ts
        env:
          RELEASE_OPERATION: ${{ needs.preflight.outputs.operation }}
          RELEASE_SUBJECT_SHA: ${{ github.sha }}
          RELEASE_STABLE_TRAIN: ${{ needs.preflight.outputs.stable-train }}
      # The standalone control binary is compiled independently of payload build.
      - run: bun run release:control:build
      - id: payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-payload
          path: .release
          if-no-files-found: error
          retention-days: 30
      - id: control
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-control
          path: dist-release-control
          if-no-files-found: error
          retention-days: 30

  bind:
    needs: [preflight, build]
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && (needs.preflight.outputs.operation == 'nightly' || needs.preflight.outputs.operation == 'stable-publish')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      binding-artifact-id: ${{ steps.binding.outputs.artifact-id }}
      binding-artifact-digest: ${{ steps.binding.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      # Downloading by server artifact ID prevents name-based artifact substitution.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.payload-artifact-id }}
          path: payload-metadata
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.control-artifact-id }}
          path: control-metadata
      # actions: read is the least privilege needed to verify the live run and
      # immutable Actions artifact metadata before emitting the binding record.
      - run: bun scripts/release/bind-artifacts.ts
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_WORKFLOW_PATH: .github/workflows/publish.yml
          RELEASE_OPERATION: ${{ needs.preflight.outputs.operation }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_HEAD_REF: ${{ github.ref }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
          RELEASE_SUBJECT_SHA: ${{ github.sha }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_PAYLOAD_ARTIFACT_ID: ${{ needs.build.outputs.payload-artifact-id }}
          RELEASE_PAYLOAD_ARTIFACT_DIGEST: ${{ needs.build.outputs.payload-artifact-digest }}
          RELEASE_CONTROL_ARTIFACT_ID: ${{ needs.build.outputs.control-artifact-id }}
          RELEASE_CONTROL_ARTIFACT_DIGEST: ${{ needs.build.outputs.control-artifact-digest }}
          RELEASE_CONTROL_PATH: control-metadata/release-control
          RELEASE_MANIFEST_PATH: payload-metadata/manifest.json
      - id: binding
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binding
          path: .release/binding.json
          if-no-files-found: error
          retention-days: 30

  # This is an identity-bound clean room: it executes only the independently
  # compiled control artifact. The subject checkout is data-only and is never
  # placed on PATH or used for module resolution.
  publish:
    needs: [preflight, build, bind]
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && vars.RELEASE_PUBLISH_ENABLED == 'true' && (needs.preflight.outputs.operation == 'nightly' || needs.preflight.outputs.operation == 'stable-publish')
    runs-on: ubuntu-latest
    environment: ${{ needs.preflight.outputs.operation == 'stable-publish' && 'release' || '' }}
    permissions:
      id-token: write
      contents: read
      actions: read
    outputs:
      stable-train: ${{ steps.execute.outputs.stable_train }}
    steps:
      # This is the sole Bun-only exception: npm >=11.5.1 is required for OIDC trusted publishing.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14.0'
      - name: Require runner npm
        run: |
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) process.exit(1)'
          npm --version | awk -F. '$1 > 11 || ($1 == 11 && $2 >= 5) { exit 0 } { exit 1 }'
      - name: Reject credential sources before OIDC or npm
        run: |
          test -z "${NODE_AUTH_TOKEN:-}" && test -z "${NPM_TOKEN:-}"
          env | grep -Eiq '^(npm_config_(_auth|_authtoken|auth|//.*:_auth)|NPM_CONFIG_(_AUTH|_AUTHTOKEN|AUTH|//.*:_AUTH)|NPM_CONFIG_USERCONFIG|.*(CREDENTIAL_HELPER|KEYCHAIN))=' && exit 1 || true
          for file in "$GITHUB_WORKSPACE/.npmrc" "$HOME/.npmrc" "$(npm config get globalconfig)" "${NPM_CONFIG_USERCONFIG:-}"; do
            test -z "$file" || test ! -f "$file" || ! grep -Eiq '^[[:space:]]*(_auth|_authToken|authToken|//[^=]+:[[:space:]]*_auth(Token)?)[[:space:]]*=' "$file" || exit 1
          done
          ! npm config list -l | grep -Eiq '(_auth|_authToken|authToken|//[^=]+:[[:space:]]*_auth(Token)?)'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.bind.outputs.binding-artifact-id }}
          path: binding
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.control-artifact-id }}
          path: control
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.payload-artifact-id }}
          path: payload
      - id: subject
        name: Verify artifact checksums and construct control invocation
        run: |
          expected_control_sha="$(jq -er '.files[] | select(.filename == "release-control") | .sha256' binding/binding.json)"
          actual_control_sha="sha256:$(sha256sum control/release-control | awk '{print $1}')"
          test "$actual_control_sha" = "$expected_control_sha"
          subject_sha="$(jq -er '.releaseSubjectSha' binding/binding.json)"
          echo "sha=$subject_sha" >> "$GITHUB_OUTPUT"
          jq --arg operation '${{ needs.preflight.outputs.operation }}' --arg subjectSha "$subject_sha" '. as $manifest | {repository:"weave-io/weave",workflowPath:".github/workflows/publish.yml",eventName:"workflow_dispatch",ref:"refs/heads/main",operation:$operation,channel:(if $operation == "nightly" then "nightly" else "stable" end),subjectSha:$subjectSha,packages:$manifest.packages,versions:$manifest.versions}' payload/manifest.json > invocation.json
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ steps.subject.outputs.sha }}
          path: subject-data
          persist-credentials: false
      - id: execute
        name: Execute verified standalone control only
        run: |
          chmod 700 control/release-control
          ./control/release-control invocation.json payload/manifest.json payload binding/binding.json | tee control-output.jsonl
          stable_train="$(jq -ce 'select(.stableTrain != null) | .stableTrain' control-output.jsonl || true)"
          if [ -n "$stable_train" ]; then
            echo "stable_train=$stable_train" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
          RELEASE_HEAD_REF: ${{ github.ref }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
      # npm trusted publishing cannot run `npm dist-tag add` (npm/cli#8547).
      # This exposes only human-run instructions; no workflow command mutates tags.
      - name: Record manual promotion authorization
        if: needs.preflight.outputs.operation == 'stable-publish'
        run: |
          authorization="$(jq -c ".promotionAuthorization // empty" control-output.jsonl)"
          commands="$(jq -c ".promotionCommands // empty" control-output.jsonl)"
          test -n "$authorization"
          test -n "$commands"
          {
            echo '## Manual MFA promotion required'
            echo "Save this identity-bound authorization and the verified control-generated commands. These instructions are for a human maintainer's interactive MFA session; this workflow never executes them."
            echo '```json'
            echo "$authorization"
            echo '```'
            echo 'Promotion and rollback commands:'
            echo '```bash'
            echo "$commands" | jq -r '.promoteCommands[], .rollbackCommands[]'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable operations are fail-closed behind the manually administered release
  # environment. This job produces only plans; it has no contents:write grant.
  stable-plan:
    needs: preflight
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && (needs.preflight.outputs.operation == 'stable-cut' || needs.preflight.outputs.operation == 'stable-fix')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      # Task 15 replays the recorded worktree metadata; this control step never
      # writes the protected checkout and does not receive an App credential.
      - run: bun scripts/release/stable-plan-main.ts
        env:
          RELEASE_STABLE_PLAN_INPUT: ${{ needs.preflight.outputs.stable-plan-input }}

  metadata-replay-plan:
    needs: preflight
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && needs.preflight.outputs.operation == 'metadata-replay'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun scripts/release/metadata-replay-main.ts
        env:
          RELEASE_METADATA_REPLAY_INPUT: ${{ needs.preflight.outputs.metadata-replay-input }}
      - run: echo 'Metadata replay is plan-only; maintainer creates release-metadata branch from protected main and opens the normal PR.' >> "$GITHUB_STEP_SUMMARY"

  # Read-only final verification after a second maintainer performed MFA tag moves.
  # No id-token, token, or npm mutation capability is granted here.
  stable-finalize:
    needs: preflight
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && needs.preflight.outputs.operation == 'stable-finalize'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      stable-train: ${{ steps.finalize.outputs.stable_train }}
      payload-artifact-id: ${{ steps.finalize.outputs.payload_artifact_id }}
      origin-run-id: ${{ steps.finalize.outputs.origin_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - id: finalize
        name: Verify both promoted latest tags and tarball digests
        run: |
          bun scripts/release/stable-finalize.ts
          train="$RELEASE_STABLE_TRAIN"
          payload_artifact_id="$(printf '%s' "$train" | jq -er '.artifactIds[0]')"
          echo "payload_artifact_id=$payload_artifact_id" >> "$GITHUB_OUTPUT"
          origin_run_id="$(printf '%s' "$RELEASE_PROMOTION_AUTHORIZATION" | jq -er '.originRunId')"
          echo "origin_run_id=$origin_run_id" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_PROMOTION_AUTHORIZATION: ${{ inputs.promotion-authorization }}
          RELEASE_STABLE_TRAIN: ${{ needs.preflight.outputs.stable-train }}

  # Mint the short-lived App installation token only inside the protected
  # release-refs environment. GITHUB_TOKEN remains read-only.
  release-refs:
    needs: [preflight, stable-finalize]
    if: inputs.operation != 'preflight' && needs.preflight.outputs.skipped != 'true' && needs.preflight.outputs.operation == 'stable-finalize'
    runs-on: ubuntu-latest
    environment: release-refs
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stable-finalize.outputs.payload-artifact-id }}
          run-id: ${{ needs.stable-finalize.outputs.origin-run-id }}
          github-token: ${{ github.token }}
          path: .release-payload
      - id: release-app-token
        name: Mint short-lived release App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - run: bun scripts/release/release-refs-main.ts
        env:
          RELEASE_APP_INSTALLATION_TOKEN: ${{ steps.release-app-token.outputs.token }}
          RELEASE_PROMOTION_AUTHORIZATION: ${{ inputs.promotion-authorization }}
          RELEASE_PAYLOAD_DIRECTORY: .release-payload
          RELEASE_RELEASE_NOTES: Automated release
          RELEASE_PROGRESSED_STABLE_TRAIN: ${{ needs.stable-finalize.outputs.stable-train }}
          RELEASE_AWAITING_STABLE_TRAIN: ${{ needs.preflight.outputs.stable-train }}
