name: Verify OpenCode2 Adapter

on:
  push:
    branches: [main]
    paths:
      - 'packages/adapters/opencode2/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/adapters/opencode2/**'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-opencode2:
    name: Verify opencode2 (Podman)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.10"

      - name: Verify Podman is available
        run: podman --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify opencode2 adapter
        run: bun run --filter '@weaveio/weave-adapter-opencode2' verify:opencode2
